name: Build TCPBoost Kernel

on:
  # 每周一 UTC 04:00 自动构建
  schedule:
    - cron: '0 4 * * 1'
  # 手动触发
  workflow_dispatch:
    inputs:
      kernel_version:
        description: '内核版本 (如 6.12.73)'
        required: false
        default: '6.12.73'
      force_build:
        description: '强制构建 (跳过版本检查)'
        required: false
        type: boolean
        default: false

env:
  KERNEL_VERSION: ${{ github.event.inputs.kernel_version || '6.12.73' }}
  KERNEL_MAJOR: '6.12'
  CCACHE_DIR: /home/runner/.ccache

jobs:
  check-version:
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      latest_version: ${{ steps.check.outputs.latest_version }}
    steps:
      - name: 检查最新内核版本
        id: check
        run: |
          # 获取 6.12.x 系列最新版本
          LATEST=$(curl -sf https://www.kernel.org/feeds/kdist.xml | \
            grep -oP '(?<=<title>stable: )6\.12\.\d+' | head -1)
          if [ -z "$LATEST" ]; then
            LATEST="${{ env.KERNEL_VERSION }}"
          fi
          echo "latest_version=$LATEST" >> $GITHUB_OUTPUT
          echo "最新版本: $LATEST"

          if [ "${{ github.event.inputs.force_build }}" = "true" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "强制构建模式"
            exit 0
          fi

          # 检查是否已有该版本的 Release
          TAG="v${LATEST}-tcpboost"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "版本 $TAG 已存在, 跳过构建"
          else
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "版本 $TAG 不存在, 需要构建"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-kernel:
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 720
    env:
      KBUILD_BUILD_USER: "tcpboost"
      KBUILD_BUILD_HOST: "github-actions"
      KBUILD_BUILD_TIMESTAMP: ""
      KDEB_COMPRESS: "xz"
    strategy:
      matrix:
        include:
          - arch: x86_64
            cross_prefix: ''
            deb_arch: amd64
    steps:
      - name: 检出 tcpboost 仓库
        uses: actions/checkout@v4

      - name: 设置构建环境
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libncurses-dev bison flex libssl-dev libelf-dev \
            bc kmod cpio dpkg-dev rpm fakeroot debhelper \
            curl wget git ccache \
            rsync python3 pahole libdw-dev lz4 zstd quilt dh-python

      - name: 设置 ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: kernel-${{ needs.check-version.outputs.latest_version }}-${{ matrix.arch }}
          restore-keys: |
            kernel-

      - name: 下载内核源码
        run: |
          VERSION="${{ needs.check-version.outputs.latest_version }}"
          echo "下载 Linux ${VERSION} 源码..."
          curl -fSL "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${VERSION}.tar.xz" -o linux.tar.xz
          tar -xf linux.tar.xz
          mv "linux-${VERSION}" linux-src

      - name: 获取 CloudPassenger 补丁
        run: |
          echo "从 CloudPassenger 仓库获取 BBR 补丁..."
          git clone --depth=1 https://github.com/CloudPassenger/Cloud-Kernel-BBRv3.git cp-patches

          # 设置 quilt 补丁目录结构
          mkdir -p linux-src/patches/custom
          PATCH_DIR="cp-patches/kernel_patches/${{ env.KERNEL_MAJOR }}"
          if [ -d "$PATCH_DIR" ]; then
            find "$PATCH_DIR" -name '*.patch' -type f | sort | while read -r f; do
              cp -v "$f" linux-src/patches/custom/
            done
          fi

          # 生成 quilt series 文件
          cd linux-src/patches
          echo "# Custom Patches (BBRPlus, Brutal)" > series
          find custom -type f -name "*.patch" -printf "custom/%P\n" | sort >> series

          PATCH_COUNT=$(grep -c '.patch' series 2>/dev/null || echo 0)
          echo "补丁数量: $PATCH_COUNT"
          if [ "$PATCH_COUNT" -eq 0 ]; then
            echo "⚠️ 未找到任何补丁文件"
            exit 1
          fi
          echo "series 文件内容:"
          cat series

      - name: 应用补丁
        working-directory: linux-src
        run: |
          quilt push -a

      - name: 修复补丁兼容性（6.12 API 适配）
        working-directory: linux-src
        run: |
          # 1. BBRPlus struct bbr 超出 ICSK_CA_PRIV_SIZE (104 bytes)
          #    所有 BBRPlus 项目都通过增大 ICSK_CA_PRIV_SIZE 来解决
          #    参考: UJX6N/bbrplus-6.x_stable, CloudPassenger/Cloud-Kernel-BBRv3
          echo "修复 ICSK_CA_PRIV_SIZE (104→112 bytes)..."
          sed -i 's/icsk_ca_priv\[104 \/ sizeof(u64)\]/icsk_ca_priv[112 \/ sizeof(u64)]/' \
            include/net/inet_connection_sock.h

          # 2. CloudPassenger 补丁使用 .tso_segs 回调（Google BBR 补丁集专有 API）
          #    Linux 6.12 主线使用 .min_tso_segs，签名不同，需要适配
          echo "修复 BBRv1 补丁 tso_segs → min_tso_segs..."
          sed -i 's/\.tso_segs.*=.*bbr1_tso_segs,/.min_tso_segs\t= bbr_min_tso_segs,/' net/ipv4/tcp_bbr1.c
          sed -i '/^__bpf_kfunc static u32 bbr1_tso_segs/,/^}/d' net/ipv4/tcp_bbr1.c
          sed -i '/BTF_ID_FLAGS(func, bbr1_tso_segs)/d' net/ipv4/tcp_bbr1.c

          echo "修复 BBRPlus 补丁 tso_segs → min_tso_segs..."
          sed -i 's/\.tso_segs.*=.*bbr_tso_segs,/.min_tso_segs\t= bbr_min_tso_segs,/' net/ipv4/tcp_bbrplus.c
          sed -i '/^__bpf_kfunc static u32 bbr_tso_segs/,/^}/d' net/ipv4/tcp_bbrplus.c
          sed -i '/BTF_ID_FLAGS(func, bbr_tso_segs)/d' net/ipv4/tcp_bbrplus.c

          echo "验证修复结果..."
          echo "=== ICSK_CA_PRIV_SIZE ==="
          grep -n 'icsk_ca_priv' include/net/inet_connection_sock.h
          echo "=== BBRv1 min_tso_segs ==="
          grep -n 'min_tso_segs\|tso_segs\|bbr_min_tso_segs' net/ipv4/tcp_bbr1.c | head -5
          echo "=== BBRPlus min_tso_segs ==="
          grep -n 'min_tso_segs\|tso_segs\|bbr_min_tso_segs' net/ipv4/tcp_bbrplus.c | head -5

      - name: 应用 tcpboost 编译配置
        working-directory: linux-src
        run: |
          # 使用 localversion 文件替代 LOCALVERSION 参数，避免连字符导致 debian 包版本号问题
          echo "-tcpboost" > localversion

          chmod +x "${{ github.workspace }}/configs/x86_64_apply.sh"
          bash "${{ github.workspace }}/configs/x86_64_apply.sh" .

          echo ""
          echo "=== 已启用的 TCP 拥塞控制 ==="
          grep -E 'CONFIG_TCP_CONG_(BBR|BRUTAL|BBRPLUS)' .config || true
          echo "=== 默认拥塞控制 ==="
          grep 'CONFIG_DEFAULT_TCP_CONG' .config || true

      - name: 编译内核 (DEB)
        working-directory: linux-src
        run: |
          export CC="ccache gcc"
          export HOSTCC="ccache gcc"
          ccache -M 5G
          ccache -z

          echo "开始编译 DEB 包..."
          JOBS=$(nproc)
          echo "并行任务数: $JOBS"

          DEB_BUILD_PROFILES=pkg.linux-upstream.nokernelheaders \
          make -j${JOBS} bindeb-pkg

          ccache -s

          echo "=== DEB 产物 ==="
          find .. -maxdepth 1 -name "*.deb" -exec ls -lh {} \;
          find . -maxdepth 1 -name "*.deb" -exec ls -lh {} \;

      - name: 编译内核 (RPM)
        working-directory: linux-src
        run: |
          echo "正在生成 RPM 包..."
          make -j$(nproc) binrpm-pkg || {
            echo "RPM 打包失败, 尝试手动打包..."
            sudo apt-get install -y alien
            DEB_FILE=$(ls -t ../*.deb 2>/dev/null | head -1)
            if [ -n "$DEB_FILE" ]; then
              echo "使用 alien 转换: $DEB_FILE"
              sudo alien --to-rpm "$DEB_FILE"
            fi
          }

          echo "=== RPM 产物 ==="
          find rpmbuild -name "*.rpm" -exec ls -lh {} \;

      - name: 收集构建产物
        run: |
          mkdir -p artifacts

          echo "=== 搜索 DEB 文件 ==="
          find . -maxdepth 1 -name "*.deb" -exec echo "找到: {}" \; -exec mv {} artifacts/ \;
          # bindeb-pkg 产物在 linux-src 上级（即项目根目录）
          find linux-src/.. -maxdepth 1 -name "*.deb" -exec echo "找到: {}" \; -exec mv {} artifacts/ \;

          echo "=== 搜索 RPM 文件 ==="
          # binrpm-pkg 产物在 linux-src/rpmbuild/ 下
          find linux-src/rpmbuild -name "*.rpm" -exec echo "找到: {}" \; -exec mv {} artifacts/ \;
          find . -maxdepth 3 -name "*.rpm" -exec echo "找到: {}" \; -exec mv {} artifacts/ \;

          echo "=== 构建产物 ==="
          ls -lh artifacts/
          if [ -z "$(ls -A artifacts/ 2>/dev/null)" ]; then
            echo "❌ 未找到任何构建产物！"
            echo "=== 调试：项目根目录文件 ==="
            ls -lh ../*.deb ../*.rpm 2>/dev/null || true
            ls -lh ./*.deb ./*.rpm 2>/dev/null || true
            echo "=== 调试：rpmbuild 目录 ==="
            find linux-src/rpmbuild -type f 2>/dev/null || true
            exit 1
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.arch }}
          path: artifacts/
          retention-days: 1

  create-release:
    needs: [check-version, build-kernel]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: 创建 Release
        run: |
          VERSION="${{ needs.check-version.outputs.latest_version }}"
          TAG="v${VERSION}-tcpboost"

          echo "创建 Release: $TAG"
          echo "产物列表:"
          ls -lhR artifacts/

          # 生成 Release Notes
          cat > RELEASE_NOTES.md <<EOF
          ## TCPBoost 内核 ${VERSION}

          基于 Linux ${VERSION} 编译，集成以下 TCP 拥塞控制算法：

          - **BBRv3** — Google 最新版，推荐通用场景
          - **BBRPlus** — 高丢包链路优化
          - **TCP Brutal** — Hysteria2/sing-box 专用
          - **BBRv1** — 原版，兼容性好

          ### 支持系统

          | 格式 | 系统 |
          |------|------|
          | \`.deb\` | Debian 11/12, Ubuntu 20.04+ |
          | \`.rpm\` | Rocky 9, Alma 9, CentOS Stream 9 |

          ### 安装方法

          \`\`\`bash
          bash <(curl -fsSL https://raw.githubusercontent.com/$(echo ${{ github.repository }})/main/tcp.sh)
          \`\`\`

          ### 验证

          \`\`\`bash
          # 检查可用算法
          sysctl net.ipv4.tcp_available_congestion_control
          # 应显示: bbr bbrplus bbr1
          \`\`\`
          EOF

          # 收集所有产物文件
          RELEASE_FILES=$(find artifacts/ -type f | sort)
          if [ -z "$RELEASE_FILES" ]; then
            echo "❌ 未找到任何产物文件！"
            exit 1
          fi

          echo "上传文件列表:"
          echo "$RELEASE_FILES"

          # shellcheck disable=SC2086
          gh release create "$TAG" $RELEASE_FILES \
            --title "TCPBoost Kernel ${VERSION}" \
            --notes-file RELEASE_NOTES.md \
            --target main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
