name: Build TCPBoost Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: '内核版本 (如 6.12.73)'
        required: false
        default: '6.12.90'
      force_build:
        description: '强制构建 (跳过版本检查)'
        required: false
        type: boolean
        default: false

env:
  KERNEL_VERSION: ${{ github.event.inputs.kernel_version || '6.12.73' }}
  KERNEL_MAJOR: '6.12'
  CCACHE_DIR: /home/runner/.ccache

jobs:
  check-version:
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      latest_version: ${{ steps.check.outputs.latest_version }}
    steps:
      - name: Check latest kernel version
        id: check
        run: |
          LATEST=$(curl -sf https://www.kernel.org/feeds/kdist.xml | \
            grep -oP '(?<=<title>stable: )6\.12\.\d+' | head -1)
          if [ -z "$LATEST" ]; then
            LATEST="${{ env.KERNEL_VERSION }}"
          fi

          # Ensure version >= 6.12.90 (create_bbrplusv3.sh sed patterns
          # are calibrated for 6.12.90+ BBRv3 source code)
          MIN_VERSION="6.12.90"
          if printf '%s\n' "$MIN_VERSION" "$LATEST" | sort -V | head -1 | grep -q "$MIN_VERSION"; then
            echo "kernel.org returned $LATEST < $MIN_VERSION, using minimum"
            LATEST="$MIN_VERSION"
          fi

          echo "latest_version=$LATEST" >> $GITHUB_OUTPUT
          echo "最新版本: $LATEST"

          if [ "${{ github.event.inputs.force_build }}" = "true" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "强制构建模式"
            exit 0
          fi

          TAG="v${LATEST}-tcpboost"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "版本 $TAG 已存在, 跳过构建"
          else
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "版本 $TAG 不存在, 需要构建"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-kernel:
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 720
    env:
      KBUILD_BUILD_USER: "tcpboost"
      KBUILD_BUILD_HOST: "github-actions"
      KBUILD_BUILD_TIMESTAMP: ""
      KDEB_COMPRESS: "xz"
    strategy:
      matrix:
        include:
          - arch: x86_64
            cross_prefix: ''
            deb_arch: amd64
    steps:
      - name: Checkout tcpboost repo
        uses: actions/checkout@v4

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libncurses-dev bison flex libssl-dev libelf-dev \
            bc kmod cpio dpkg-dev rpm fakeroot debhelper \
            curl wget git ccache \
            rsync python3 pahole libdw-dev lz4 zstd quilt dh-python

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: kernel-${{ needs.check-version.outputs.latest_version }}-${{ matrix.arch }}
          restore-keys: |
            kernel-

      - name: Download kernel source
        run: |
          VERSION="${{ needs.check-version.outputs.latest_version }}"
          echo "下载 Linux ${VERSION} 源码..."
          curl -fSL "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${VERSION}.tar.xz" -o linux.tar.xz
          tar -xf linux.tar.xz
          mv "linux-${VERSION}" linux-src

      - name: Apply Xanmod BBRv3 patches (quilt)
        working-directory: linux-src
        run: |
          mkdir -p patches
          cd patches

          echo "# Xanmod BBRv3 - replaces mainline BBRv1 with BBRv3" > series
          find "${{ github.workspace }}/patches/xanmod-bbrv3" \
            -name '*.patch' -type f | sort | while read -r f; do
            base=$(basename "$f")
            cp -v "$f" .
            echo "$base" >> series
          done

          echo ""
          echo "=== quilt series ==="
          cat series
          echo ""

          cd ..
          quilt push -a

          echo ""
          echo "=== Xanmod BBRv3 patches applied ==="

      - name: Apply CloudPassenger custom patches (patch -p1)
        working-directory: linux-src
        run: |
          git clone --depth=1 https://github.com/CloudPassenger/Cloud-Kernel-BBRv3.git /tmp/cp-patches
          PATCH_DIR="/tmp/cp-patches/kernel_patches/${{ env.KERNEL_MAJOR }}"

          if [ ! -d "$PATCH_DIR" ]; then
            echo "ERROR: CloudPassenger patch dir not found: $PATCH_DIR"
            exit 1
          fi

          for patch_file in $(find "$PATCH_DIR" -name '*.patch' -type f | sort); do
            patch_name=$(basename "$patch_file")
            echo ""
            echo "=== Applying CloudPassenger patch: $patch_name ==="

            if patch -p1 --no-backup-if-mismatch -F3 --dry-run < "$patch_file" >/dev/null 2>&1; then
              patch -p1 --no-backup-if-mismatch -F3 < "$patch_file"
              echo "Patch $patch_name applied successfully (p1)"
            elif patch -p0 --no-backup-if-mismatch -F3 --dry-run < "$patch_file" >/dev/null 2>&1; then
              patch -p0 --no-backup-if-mismatch -F3 < "$patch_file"
              echo "Patch $patch_name applied successfully (p0)"
            else
              echo "Patch $patch_name cannot be applied cleanly, forcing partial application..."
              patch -p1 --force --no-backup-if-mismatch -F3 < "$patch_file" 2>&1 || true
              echo "Patch $patch_name force-applied (rejected hunks saved as .rej)"
            fi

            find . -name '*.rej' -exec echo "REJECT: {}" \; 2>/dev/null || true
            find . -name '*.rej' -delete 2>/dev/null || true
          done

          echo ""
          echo "=== CloudPassenger patches applied ==="
          echo "--- New files ---"
          ls -la net/ipv4/tcp_bbr1.c net/ipv4/tcp_bbrplus.c net/ipv4/tcp_brutal.c 2>/dev/null || echo "Some files missing"

      - name: Fix patch compatibility (6.12 API + conflict resolution)
        working-directory: linux-src
        run: |
          # 1. ICSK_CA_PRIV_SIZE - must be 144 bytes for BBRv3 struct bbr
          echo "Fixing ICSK_CA_PRIV_SIZE..."
          FILE="include/net/inet_connection_sock.h"
          CURRENT=$(grep -oP 'icsk_ca_priv\[\K\d+' "$FILE" 2>/dev/null || echo "0")
          echo "Current ICSK_CA_PRIV_SIZE: $CURRENT / sizeof(u64)"
          NEED=144
          if [ "$CURRENT" -lt "$NEED" ]; then
            echo "Increasing ICSK_CA_PRIV_SIZE ($CURRENT -> $NEED)..."
            sed -i "s/icsk_ca_priv\[$CURRENT \/ sizeof(u64)\]/icsk_ca_priv[$NEED \/ sizeof(u64)]/" "$FILE"
          fi

          # 2. Ensure CloudPassenger algorithms are registered in Makefile
          echo ""
          echo "=== Checking CloudPassenger algorithm registration ==="

          if ! grep -q 'tcp_bbr1' net/ipv4/Makefile; then
            echo 'obj-$(CONFIG_TCP_CONG_BBR1) += tcp_bbr1.o' >> net/ipv4/Makefile
          fi

          if ! grep -q 'tcp_bbrplus' net/ipv4/Makefile; then
            echo 'obj-$(CONFIG_TCP_CONG_BBRPLUS) += tcp_bbrplus.o' >> net/ipv4/Makefile
          fi

          if ! grep -q 'tcp_brutal' net/ipv4/Makefile; then
            echo 'obj-$(CONFIG_TCP_CONG_BRUTAL) += tcp_brutal.o' >> net/ipv4/Makefile
          fi

          # Ensure Kconfig entries exist
          for algo in BBR1 BBRPLUS BRUTAL; do
            if ! grep -q "config TCP_CONG_${algo}" net/ipv4/Kconfig; then
              echo "Adding Kconfig entry: TCP_CONG_${algo}..."
              case "$algo" in
                BBR1)
                  printf '\nconfig TCP_CONG_BBR1\n\ttristate "BBRv1 TCP"\n\tdepends on TCP_CONG_ADVANCED\n\tdefault m\n' >> net/ipv4/Kconfig
                  ;;
                BBRPLUS)
                  printf '\nconfig TCP_CONG_BBRPLUS\n\ttristate "BBRPLUS TCP"\n\tdepends on TCP_CONG_ADVANCED\n\tdefault m\n' >> net/ipv4/Kconfig
                  ;;
                BRUTAL)
                  printf '\nconfig TCP_CONG_BRUTAL\n\ttristate "TCP Brutal"\n\tdepends on TCP_CONG_ADVANCED\n\tdefault m\n' >> net/ipv4/Kconfig
                  ;;
              esac
            fi
          done

          # 3. Fix tso_segs callback for 6.12 compat
          # In 6.12, tso_segs callback signature changed from
          #   u32 (*)(struct sock *) -> void (*)(struct sock *, u32, u32)
          # CloudPassenger patches use the old signature, so remove the
          # assignment and let the kernel use default behavior.
          for src in net/ipv4/tcp_bbr1.c net/ipv4/tcp_bbrplus.c; do
            if [ -f "$src" ]; then
              algo=$(basename "$src" .c | sed 's/tcp_//')
              func="${algo}_tso_segs"
              echo "Fixing $src: removing .tso_segs assignment (6.12 signature change)..."

              # Remove .tso_segs = xxx_tso_segs from ops struct
              sed -i "/\.tso_segs.*=.*${func},/d" "$src"

              # Remove the function definition (multi-line)
              sed -i "/^__bpf_kfunc static u32 ${func}/,/^}/d" "$src"
              # Also handle non-BPF variant
              sed -i "/^static u32 ${func}/,/^}/d" "$src"

              # Remove BTF reference
              sed -i "/BTF_ID_FLAGS(func, ${func})/d" "$src"

              # Remove forward declaration if any
              sed -i "/static u32 ${func}(/d" "$src"
            fi
          done

          # 4. Make tcp_tso_autosize non-static for BBRPlus
          if grep -q 'static u32 tcp_tso_autosize' net/ipv4/tcp_output.c; then
            echo "Fixing tcp_tso_autosize: static -> non-static..."
            sed -i 's/^static u32 tcp_tso_autosize/u32 tcp_tso_autosize/' net/ipv4/tcp_output.c
          fi

          echo ""
          echo "=== Verification ==="
          echo "--- ICSK_CA_PRIV_SIZE ---"
          grep -n 'icsk_ca_priv' include/net/inet_connection_sock.h
          echo "--- Makefile TCP modules ---"
          grep -E 'tcp_bbr|tcp_brutal' net/ipv4/Makefile
          echo "--- Kconfig TCP options ---"
          grep -E 'config TCP_CONG_(BBR|BRUTAL)' net/ipv4/Kconfig
          echo "--- TCP module files ---"
          ls net/ipv4/tcp_bbr*.c net/ipv4/tcp_brutal.c 2>/dev/null || echo "(some files missing)"

      - name: Create BBRPlusV3 algorithm
        working-directory: linux-src
        run: |
          # 基于 BBRv3 tcp_bbr.c 动态创建 bbrplusv3
          # BBRPlusV3 = BBRv3 基线 + BBRPlus 激进探测思想
          chmod +x "${{ github.workspace }}/scripts/create_bbrplusv3.sh"
          bash "${{ github.workspace }}/scripts/create_bbrplusv3.sh" .

          echo ""
          echo "=== BBRPlusV3 创建验证 ==="
          if [ -f net/ipv4/tcp_bbrplusv3.c ]; then
            echo "tcp_bbrplusv3.c 已创建"
            wc -l net/ipv4/tcp_bbrplusv3.c
          else
            echo "tcp_bbrplusv3.c 创建失败"
            exit 1
          fi

      - name: Apply tcpboost build config
        working-directory: linux-src
        run: |
          echo "-tcpboost" > localversion

          chmod +x "${{ github.workspace }}/configs/x86_64_apply.sh"
          bash "${{ github.workspace }}/configs/x86_64_apply.sh" .

          echo ""
          echo "=== 已启用的 TCP 拥塞控制 ==="
          grep -E 'CONFIG_TCP_CONG_(BBR|BRUTAL|BBRPLUS)' .config || true
          echo "=== 默认拥塞控制 ==="
          grep 'CONFIG_DEFAULT_TCP_CONG' .config || true

      - name: Verify critical network protocols
        working-directory: linux-src
        run: |
          # 验证步骤只用于诊断展示，不应让 CI 失败
          set +e
          echo ""
          echo "======================================================"
          echo "  验证关键网络协议 (修复 ws/xhttp/协议不支持 问题)"
          echo "======================================================"
          PASS=0
          FAIL=0
          for cfg in \
            CONFIG_NETFILTER \
            CONFIG_NETFILTER_XTABLES \
            CONFIG_NF_CONNTRACK \
            CONFIG_NF_NAT \
            CONFIG_NETFILTER_XT_MATCH_CONNTRACK \
            CONFIG_NETFILTER_XT_MATCH_STATE \
            CONFIG_NETFILTER_XT_MATCH_MULTIPORT \
            CONFIG_NETFILTER_XT_TARGET_MASQUERADE \
            CONFIG_NETFILTER_XT_TARGET_REDIRECT \
            CONFIG_NETFILTER_XT_TARGET_TPROXY \
            CONFIG_NETFILTER_XT_TARGET_LOG \
            CONFIG_NETFILTER_TPROXY \
            CONFIG_IP_NF_IPTABLES \
            CONFIG_IP_NF_FILTER \
            CONFIG_IP_NF_NAT \
            CONFIG_IP_NF_MANGLE \
            CONFIG_IP_NF_RAW \
            CONFIG_NF_TABLES \
            CONFIG_NF_TABLES_INET \
            CONFIG_NF_TABLES_IPV4 \
            CONFIG_NFT_CT \
            CONFIG_NFT_CHAIN_NAT \
            CONFIG_NFT_MASQ \
            CONFIG_NFT_TPROXY \
            CONFIG_TUN \
            CONFIG_TAP \
            CONFIG_WIREGUARD \
            CONFIG_VXLAN \
            CONFIG_IPIP \
            CONFIG_GRE \
            CONFIG_NET_FOU \
            CONFIG_NET_UDP_TUNNEL \
            CONFIG_XFRM_USER \
            CONFIG_INET_XFRM_MODE_TRANSPORT \
            CONFIG_INET_XFRM_MODE_TUNNEL \
            CONFIG_INET_ESP \
            CONFIG_NET_SCHED \
            CONFIG_NET_SCH_FQ \
            CONFIG_NET_SCH_HTB \
            CONFIG_NET_SCH_TBF \
            CONFIG_NET_SCH_PRIO \
            CONFIG_NET_SCH_SFQ \
            CONFIG_NET_SCH_RED \
            CONFIG_NET_SCH_HFSC \
            CONFIG_NET_SCH_INGRESS \
            CONFIG_NET_CLS \
            CONFIG_NET_CLS_BPF \
            CONFIG_NET_CLS_U32 \
            CONFIG_NET_CLS_FW \
            CONFIG_NET_CLS_ROUTE4 \
            CONFIG_NET_CLS_ACT \
            CONFIG_NET_ACT_BPF \
            CONFIG_NET_ACT_GACT \
            CONFIG_NET_ACT_MIRRED \
            CONFIG_NET_ACT_POLICE \
            CONFIG_NET_ACT_VLAN \
            CONFIG_BRIDGE \
            CONFIG_VLAN_8021Q \
            CONFIG_VETH \
            CONFIG_DUMMY \
            CONFIG_MACVLAN \
            CONFIG_IPVLAN \
            CONFIG_NET_NS \
            CONFIG_CGROUPS \
            CONFIG_OVERLAY_FS \
            CONFIG_IP_VS \
            CONFIG_IP_VS_RR \
            CONFIG_IP_VS_WRR \
            CONFIG_IP_VS_LC \
            CONFIG_IP_VS_SH \
            CONFIG_IPV6 \
            CONFIG_IPV6_MULTIPLE_TABLES; do
            val=$(grep -E "^${cfg}[= ]|^# ${cfg} is not set" .config 2>/dev/null | head -1)
            if echo "$val" | grep -q "=y"; then
              printf "  OK   %-45s =y (built-in)\n" "$cfg"
              PASS=$((PASS+1))
            elif echo "$val" | grep -q "=m"; then
              printf "  OK   %-45s =m (module)\n" "$cfg"
              PASS=$((PASS+1))
            else
              printf "  MISS %-45s not enabled\n" "$cfg"
              FAIL=$((FAIL+1))
            fi
          done
          echo ""
          echo "======================================================"
          echo "  Protocol verification: OK=$PASS enabled, MISS=$FAIL"
          echo "======================================================"
          exit 0

      - name: Save final .config for audit
        working-directory: linux-src
        run: |
          cp .config "${{ github.workspace }}/tcpboost-config-${{ needs.check-version.outputs.latest_version }}"
          echo "已保存 .config 到 workspace root，将由 Collect build artifacts 步骤打包"

      - name: Build kernel (DEB)
        id: build_deb
        working-directory: linux-src
        run: |
          export CC="ccache gcc"
          export HOSTCC="ccache gcc"
          ccache -M 5G
          ccache -z

          echo "开始编译 DEB 包..."
          JOBS=$(nproc)
          echo "并行任务数: $JOBS"

          # tee 到日志文件，失败时用于诊断
          DEB_BUILD_PROFILES=pkg.linux-upstream.nokernelheaders \
          make -j${JOBS} bindeb-pkg 2>&1 | tee /tmp/build-deb.log
          BUILD_EXIT=${PIPESTATUS[0]}

          ccache -s

          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo ""
            echo "======================================================"
            echo "  BUILD FAILED (exit=$BUILD_EXIT) - 诊断上下文"
            echo "======================================================"
            echo "--- Error 上下文（最后 200 行）---"
            tail -n 200 /tmp/build-deb.log
            echo ""
            echo "--- 搜索关键错误行 ---"
            grep -nE 'Error|error:|fatal|undefined reference|No such file' /tmp/build-deb.log | tail -n 50 || true
            echo ""
            echo "--- 当前 .config 中证书/BTF 相关项 ---"
            grep -E 'CONFIG_(MODULE_SIG|SYSTEM_TRUSTED|SYSTEM_BLACKLIST|DEBUG_INFO_BTF|SECURITY_LOCKDOWN)' .config || true
            exit "$BUILD_EXIT"
          fi

          echo "=== DEB 产物 ==="
          find .. -maxdepth 1 -name "*.deb" -exec ls -lh {} \;
          find . -maxdepth 1 -name "*.deb" -exec ls -lh {} \;

      - name: Build kernel (RPM)
        working-directory: linux-src
        run: |
          echo "正在生成 RPM 包..."
          make -j$(nproc) binrpm-pkg || {
            echo "RPM 打包失败, 尝试手动打包..."
            sudo apt-get install -y alien
            DEB_FILE=$(ls -t ../*.deb 2>/dev/null | head -1)
            if [ -n "$DEB_FILE" ]; then
              echo "使用 alien 转换: $DEB_FILE"
              sudo alien --to-rpm "$DEB_FILE"
            fi
          }

          echo "=== RPM 产物 ==="
          find rpmbuild -name "*.rpm" -exec ls -lh {} \;

      - name: Collect build artifacts
        run: |
          mkdir -p artifacts

          echo "=== 搜索 DEB 文件 ==="
          find . -maxdepth 1 -name "*.deb" -exec echo "找到: {}" \; -exec mv {} artifacts/ \;
          find linux-src/.. -maxdepth 1 -name "*.deb" -exec echo "找到: {}" \; -exec mv {} artifacts/ \;

          echo "=== 搜索 RPM 文件 ==="
          find linux-src/rpmbuild -name "*.rpm" -exec echo "找到: {}" \; -exec mv {} artifacts/ \;
          find . -maxdepth 3 -name "*.rpm" -exec echo "找到: {}" \; -exec mv {} artifacts/ \;

          echo "=== 搜索 .config 审计文件 ==="
          find . -maxdepth 1 -name "tcpboost-config-*" -exec echo "找到: {}" \; -exec mv {} artifacts/ \;

          echo "=== 构建产物 ==="
          ls -lh artifacts/
          if [ -z "$(ls -A artifacts/ 2>/dev/null)" ]; then
            echo "未找到任何构建产物！"
            find .. -name "*.deb" -o -name "*.rpm" 2>/dev/null || true
            find linux-src/rpmbuild -type f 2>/dev/null || true
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.arch }}
          path: artifacts/
          retention-days: 1

  create-release:
    needs: [check-version, build-kernel]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create Release
        run: |
          VERSION="${{ needs.check-version.outputs.latest_version }}"
          TAG="v${VERSION}-tcpboost"

          echo "创建 Release: $TAG"
          echo "产物列表:"
          ls -lhR artifacts/

          cat > RELEASE_NOTES.md <<'RELEASEEOF'
          ## TCPBoost 内核
          基于 Linux 编译，集成以下 TCP 拥塞控制算法：

          - **BBRv3** — Google 最新版，推荐通用场景
          - **BBRPlusV3** — BBRv3 + BBRPlus 激进探测，高丢包链路首选
          - **BBRPlus** — 高丢包链路优化（原版）
          - **TCP Brutal** — Hysteria2/sing-box 专用
          - **BBRv1** — 原版，兼容性好

          ### BBRPlusV3 算法参数对比

          | 参数 | BBRv3 | BBRPlusV3 | 说明 |
          |------|-------|-----------|------|
          | pacing_gain UP | 1.25 | 1.50 | 更激进探测带宽 |
          | pacing_gain DOWN | 0.91 | 0.75 | 更积极排空队列 |
          | startup_cwnd_gain | 2.0 | 2.5 | STARTUP 更快填充管道 |
          | bbr_beta | 30% | 20% | 丢包时减少更少 |
          | loss_thresh | 2% | 5% | 丢包容忍度提高 |
          | probe_rtt_mode_ms | 200 | 50 | PROBE_RTT 停留更短 |
          | ecn_thresh | 50% | 70% | ECN 容忍度提高 |

          ### 支持系统

          | 格式 | 系统 |
          |------|------|
          | `.deb` | Debian 11/12, Ubuntu 20.04+ |
          | `.rpm` | Rocky 9, Alma 9, CentOS Stream 9 |

          ### 安装方法

          ```bash
          bash <(curl -fsSL https://raw.githubusercontent.com/Be90nia/tcpboost/main/tcp.sh)
          ```

          ### 验证

          ```bash
          sysctl net.ipv4.tcp_available_congestion_control
          # 应显示: bbr bbrplus bbrplusv3 bbr1 brutal
          ```
          RELEASEEOF

          # 替换版本号占位符
          sed -i "s/基于 Linux 编译/基于 Linux ${VERSION} 编译/" RELEASE_NOTES.md

          RELEASE_FILES=$(find artifacts/ -type f | sort)
          if [ -z "$RELEASE_FILES" ]; then
            echo "未找到任何产物文件！"
            exit 1
          fi

          echo "上传文件列表:"
          echo "$RELEASE_FILES"

          # Delete existing release+tag if it exists (rebuild scenario)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, deleting old release..."
            gh release delete "$TAG" --yes --cleanup-tag
            echo "Old release deleted."
          fi

          # shellcheck disable=SC2086
          gh release create "$TAG" $RELEASE_FILES \
            --title "TCPBoost Kernel ${VERSION}" \
            --notes-file RELEASE_NOTES.md \
            --target main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
